# FORGE's own secrets come from forge/prod. The SMTP credential deliberately
# does NOT: support@heros-agent.space already lives in heros/platform, and
# copying it here would create a second place to rotate and a second place to
# get it wrong. One credential, one source.
#
# NOTE: a property named here and absent from the store fails the WHOLE secret,
# not just that key — so every property below must exist before this syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge
  namespace: forge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: forge
    creationPolicy: Owner
  data:
    - secretKey: FORGE_DATABASE_URL
      remoteRef: { key: forge/prod, property: database-url }
    - secretKey: FORGE_LLM_API_KEY
      remoteRef: { key: forge/prod, property: llm-api-key }
    - secretKey: FORGE_SESSION_SECRET
      remoteRef: { key: forge/prod, property: session-secret }
    - secretKey: FORGE_SMTP_USER
      remoteRef: { key: heros/platform, property: smtp-username }
    - secretKey: FORGE_SMTP_PASSWORD
      remoteRef: { key: heros/platform, property: smtp-password }
    # FORGE's voice comes from the same Fish Audio account, and the same VOICE,
    # as jobs.heros-agent.space — that is the point of using this vendor. The key
    # is read from opportunity-bridge's own secret rather than copied here, for
    # the same reason as SMTP above: one credential, one place to rotate it.
    #
    # ⚠️ It is therefore a SHARED key: FORGE's synthesis bills and rate-limits
    # against the same account as jobs. Split it if either product's usage grows
    # enough to starve the other.
    - secretKey: FORGE_TTS_API_KEY
      remoteRef: { key: opportunity-bridge/model, property: OBA_TTS_API_KEY }

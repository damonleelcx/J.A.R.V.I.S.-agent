apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-workspaces
  namespace: forge
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-worker
  namespace: forge
  labels: { app.kubernetes.io/name: forge-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: forge-worker }
  strategy:
    # Recreate, NOT RollingUpdate. The workspace is a ReadWriteOnce PVC on a
    # single node; a rolling update wedges with the new pod Pending on the
    # volume forever. This exact failure has happened on this node before.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-worker
        # Named by the postgres and mail NetworkPolicies in the heros namespace.
        app.kubernetes.io/part-of: forge
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      hostAliases:
        - ip: "10.43.120.55"
          hostnames: ["mail.heros-agent.space"]
      containers:
        - name: forge-worker
          image: FORGE_IMAGE
          command: ["/usr/local/bin/forge-worker"]
          envFrom:
            - configMapRef: { name: forge-config }
            - secretRef:    { name: forge }
          volumeMounts:
            - { name: workspaces, mountPath: /var/lib/forge/workspaces }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            # The worker runs a build's steps (Phase 2, stage A1) and holds its
            # own CAD kernel for them: FORGE_CAD_POOL processes, started on the
            # first step that builds a surface, each holding build123d in memory.
            # The 2Gi ceiling is that room; a pool above one needs a measured
            # number for this pod before it is raised.
            # Measured 2026-09-15 on Windows (docs/spikes/2026-09-15-worker-kernel-memory):
            # pool 1 peaked at 530Mi working set with two 4,000-occurrence builds
            # contending for it; pool 2 at 1,016Mi working set but 2.7Gi private
            # (commit). FORGE_CAD_POOL stays 1 until the same run on Linux, in this
            # image, shows pool 2 under ~1.2Gi.
            # The off-node STEP export job is sized to this limit and that pool:
            # geometry.MaxExportJobParts (90,000 occurrences) is #89's 1.29 GB kernel
            # peak at 90,880 plus the worker's Go side, one export at a time, in
            # 2Gi with FORGE_CAD_POOL=1. Changing either re-opens that arithmetic
            # (internal/domain/geometry/limits.go) before it changes here.
            limits:   { cpu: "1", memory: "2Gi" }
      volumes:
        - name: workspaces
          persistentVolumeClaim: { claimName: forge-workspaces }

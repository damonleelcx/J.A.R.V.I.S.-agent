# Middleware lives in this namespace and is referenced as
# forge-redirect-https@kubernetescrd — the same shape heros-eval uses.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: forge
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge
  namespace: forge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: forge.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forged
                port: { number: 80 }
  tls:
    - hosts: [forge.heros-agent.space]
      secretName: forge-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-http-redirect
  namespace: forge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: forge-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: forge.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forged
                port: { number: 80 }

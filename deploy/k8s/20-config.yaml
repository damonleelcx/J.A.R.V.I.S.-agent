apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-config
  namespace: forge
data:
  FORGE_ENV: "production"
  FORGE_HTTP_ADDR: ":8080"
  FORGE_PUBLIC_URL: "https://forge.heros-agent.space"
  FORGE_LOG_FORMAT: "json"
  FORGE_LOG_LEVEL: "info"

  # Mail. The relay is docker-mailserver in the heros namespace. It MUST be
  # addressed as mail.heros-agent.space: the relay's certificate carries that
  # one SAN, so reaching it by Service name fails TLS — and mail then silently
  # never delivers rather than erroring. hostAliases (below, per pod) maps the
  # name to the Service ClusterIP without a CoreDNS rewrite, which would also
  # answer cert-manager's HTTP-01 self-check and break the relay's renewal.
  FORGE_MAIL_TRANSPORT: "smtp"
  FORGE_SMTP_HOST: "mail.heros-agent.space"
  FORGE_SMTP_PORT: "587"
  FORGE_MAIL_FROM_NAME: "FORGE"
  FORGE_MAIL_FROM_EMAIL: "support@heros-agent.space"

  # CAD kernel. Present in this image; an empty value would disable it and make
  # STEP export refuse with its documented message.
  FORGE_CAD_PYTHON: "/opt/cad/venv/bin/python"

  # PRD SEC-01. Deliberately has no default: FORGE will not assert what a
  # provider does with submitted content on the strength of a guess. Set to
  # no_training on 2026-09-07, matching the local .env, as a statement about the
  # Aliyun Model Studio terms this endpoint is used under. If those terms
  # change, this value is a promise that has to change with them.
  FORGE_DATA_BOUNDARY: "no_training"

  # FORGE's voice (PRD AUD-05). Fish Audio, the same vendor and the same
  # published voice as jobs.heros-agent.space, so the estate sounds like one
  # product rather than three.
  #
  # ‼️ s2.1-pro-free is Fish's FREE backbone and its terms permit using requests
  # to improve model quality. FORGE_DATA_BOUNDARY above states what the contract
  # with the MODEL endpoint says and says NOTHING about this one — speech is a
  # second egress. Chosen deliberately on 2026-09-07; switch to s2.1-pro (paid,
  # does not train) if what FORGE says aloud must not be trained on.
  # forged logs `tts_trains_on_input` at startup so this is never implied.
  # The media plane: multi-party audio rooms (PRD AUD-01).
  #
  # PUBLIC_IP is required here and is not optional: this node sits behind
  # one-to-one NAT (private 172.31.30.81, public 23.21.75.162). Left empty the
  # SFU advertises what it observes, which is the private address — ICE then
  # offers candidates nobody outside the VPC can reach, and calls fail to
  # connect with no error that says why.
  #
  # The UDP range must be open on the instance's security group; it is, as of
  # 2026-09-07 (sgr-04ea9c2e61636ec6b).
  FORGE_MEDIA_ENABLED: "true"
  FORGE_MEDIA_PUBLIC_IP: "23.21.75.162"

  FORGE_TTS_PROVIDER: "fish"
  FORGE_TTS_VOICE_ID: "df5c6c19dca944918dcbd6f1368fd02f"
  FORGE_TTS_MODEL: "s2.1-pro-free"

  FORGE_LLM_BASE_URL: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  FORGE_LLM_PLANNER_MODEL: "qwen3.8-max"

  # Vision reads images a person uploads AND the picture FORGE draws of its own
  # geometry to check it before a turn is emitted (agent/look.go). Unset, both of
  # those are off — which is what this deployment was until 2026-09-09, so the
  # visual check shipped inert here.
  #
  # It must name a model THIS endpoint serves. `qwen-vl-max` is the obvious name
  # and does not exist here: every call returns model_not_found. Measured on this
  # endpoint 2026-09-09 — qwen3.8-max reads the picture correctly in ~1.5s (with
  # deliberation off, which RoleVision now sets; with it on the same answer takes
  # 123 SECONDS), qwen3.6-flash answers WRONGLY, and glm-5.2 cannot see images.
  FORGE_LLM_VISION_MODEL: "qwen3.8-max"

  # Running model-written build123d. ON here since 2026-09-09, by an explicit
  # decision of whoever owns this deployment — it is off by default in the code
  # and in .env.example, and it should stay off anywhere that has not made this
  # decision deliberately.
  #
  # What it buys: shapes the vocabulary cannot say. An involute gear tooth, a
  # spiral, a lattice, a profile sampled from a formula. "repeat" already covers
  # repetition, which was most of the gap, so this is the last resort and the
  # contract tells the model to treat it as one.
  #
  # What it costs, stated plainly because it is a security boundary:
  #
  #   - It executes text a model produced. That is the whole feature.
  #   - The sandbox is TWO layers (internal/domain/cad/script.go). An AST
  #     whitelist refuses imports, dunder attributes and every name not on a
  #     list before anything runs — nine escapes are tested by trying them,
  #     starting with ().__class__.__bases__[0].__subclasses__(), which is why
  #     dunders are refused by NAME rather than by blacklisting escapes that
  #     are not enumerable. Then a stripped short-lived process: python -I, no
  #     environment (this deployment holds a database URL and a provider key in
  #     its own), a temporary working directory, and hard CPU, memory,
  #     file-descriptor and core limits.
  #   - It is defence in depth, NOT a container. A CPython sandbox is escapable
  #     in principle; the AST layer is the one that has to hold and the process
  #     limits are what stands if it does not.
  #
  # To turn it off again, set this to "" and redeploy. Nothing else changes:
  # a scripted part is then refused by name with the reason, and every other
  # shape is unaffected.
  FORGE_ALLOW_SCRIPTS: "1"

  # PRD SEC-05: an empty list denies every shell_run call. Deliberately narrower
  # than .env.example's development list — no `go`, no `make` — because nothing
  # on this deployment is meant to build code.
  FORGE_SHELL_ALLOWED_COMMANDS: "ls,cat,rg,git"

  FORGE_WORKSPACE_ROOT: "/var/lib/forge/workspaces"

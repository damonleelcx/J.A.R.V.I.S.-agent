# Matches the working SecretStore that heros-eval and opportunity-bridge use.
#
# There is deliberately NO auth block: on this node the provider picks up the
# EC2 instance role (heros-vm) through IMDS. An auth.jwt/serviceAccountRef block
# here is IRSA config, which this cluster does not use — it makes the store fail
# to authenticate rather than falling back.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: forge
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

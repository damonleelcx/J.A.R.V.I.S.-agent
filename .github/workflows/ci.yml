name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_pw
          POSTGRES_DB: forge
        ports:
          - 55840:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # The browser-side fences. They run the SHIPPED asset against a stubbed
      # browser and count what it does, which is the only way to catch a defect
      # where each code path is individually well-formed — one failed audio load
      # firing two handlers, or a panel that reports the one dimension it was
      # handed and "?" for the two it was not.
      #
      # They lived only in `make check`, which nothing here calls, so from the
      # day each was written until 2026-09-09 no run of CI had ever executed one.
      # A fence that CAN go red is not a fence until something makes it.
      - name: Browser-side fences
        run: make test-echo test-voice-fallback test-extrusion-size

      # Integration tests run against the live Postgres service above. A schema
      # test against a hand-written CREATE TABLE proves nothing about the schema
      # that actually ships, so these are not optional in CI.
      # The blob store's tests run against a real S3-compatible server, the same
      # SDK path production uses against AWS. Started with the Makefile so CI and
      # a laptop use one definition of it (image pinned there).
      - name: Blob store (MinIO)
        run: make blob-up blob-wait

      - name: Tests (with live Postgres and MinIO)
        run: go test -count=1 -race ./...
        env:
          FORGE_TEST_DATABASE_URL: postgres://forge:forge_dev_pw@localhost:55840/forge?sslmode=disable
          FORGE_TEST_BLOB_ENDPOINT: http://localhost:55841
          # MinIO development credentials from the Makefile. Not secrets.
          AWS_ACCESS_KEY_ID: forge
          AWS_SECRET_ACCESS_KEY: forge_dev_minio
          AWS_REGION: us-east-1

      # NFR-07 is a claim about what happens when things BREAK, and nothing else
      # in the suite breaks anything: the unit tests exercise the happy path and
      # the integration tests exercise a working database. These kill a worker
      # holding a lease, fail a dependency terminally, settle a goal with work
      # outstanding, and corrupt a checkpoint — then check what survived.
      #
      # A drill that cannot prove its fault landed is reported VACUOUS and fails
      # the run, so a green line here means something was actually disturbed.
      - name: Recovery drills (real injected faults)
        run: go run ./cmd/forgectl drill run
        env:
          FORGE_DATABASE_URL: postgres://forge:forge_dev_pw@localhost:55840/forge?sslmode=disable

      - name: Build
        run: make build

  # The real CAD kernel. Until 2026-09-14 no CI run had ever executed a kernel
  # test: they need build123d, and the check job has none, so every one of them
  # skipped — green. Volumes, fillets, interference, mirrors and STEP export are
  # properties of OpenCASCADE, so they are only proven where OpenCASCADE runs.
  # Python 3.13 and the pinned list are what the production image uses.
  #
  # arm64, because FORGE deploys on arm64 (the image is built for it): this job
  # proves the kernel production runs. Decided 2026-09-14 after its first two runs
  # on ubuntu-latest (x86_64) both timed out TestScript_BuildsWhatTheVocabularyCannot
  # at the 30 s script limit, while every other kernel test there was ~1.6x slower
  # than a laptop and the same script took 3.1 s in the arm64 image capped to one
  # CPU. That x86 behaviour is OPEN, not fixed: see the plan's execution record.
  kernel:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: internal/domain/cad/requirements.txt

      # The same X/GL libraries deploy/Dockerfile installs: OpenCASCADE links
      # against them even though it never opens a window.
      - name: System libraries for OpenCASCADE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libglu1-mesa libx11-6 libxext6 libxrender1 libxi6 \
            libsm6 libice6 libfontconfig1 libfreetype6

      - name: Kernel venv (pinned)
        run: make cad-venv

      - name: Kernel tests (real build123d)
        run: make test-cad

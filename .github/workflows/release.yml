name: Release

# Cutting a release is one command, and it is the same command a person runs.
#
# The gate below is `make release-check` — formatting, vet, the whole test suite
# against a live Postgres, and the recovery drills with real injected faults.
# Nothing here re-implements those steps in YAML: a workflow that lists its own
# checks drifts from the Makefile, and the day it drifts is the day a release
# passes a gate nobody can run locally.
on:
  push:
    tags: ["v*"]
  # Runnable by hand against a branch, so the release path can be exercised
  # without minting a tag. It builds and verifies; it publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_pw
          POSTGRES_DB: forge
        ports:
          - 55840:5432
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Tags are not enough: `git describe` needs the history to produce a
      # version, and a shallow checkout stamps every binary with a bare hash.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release gate
        run: make release-check
        env:
          FORGE_TEST_DATABASE_URL: postgres://forge:forge_dev_pw@localhost:55840/forge?sslmode=disable

      - name: Cross-platform binaries
        run: make dist

      # The artefact, not the recipe. A binary built without ldflags reports
      # "dev" and is indistinguishable from a release once it has left this
      # machine, so the check is on what the binary SAYS about itself.
      - name: Verify the binaries report their version
        run: make dist-verify

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Every release carries what it cannot do. The alternative is a
          # download page that reads as a finished product, and this build has
          # named gaps — no SSO, no realtime audio transport, no prompt-injection
          # defence, and tool inputs that are not validated against their
          # declared schema.
          body: |
            Built by `make release-check` then `make dist`: formatting, vet, the
            full test suite against a live Postgres, and the recovery drills with
            real injected faults. `SHA256SUMS` covers every binary.

            **What this build does not do.** Read
            `docs/implementation-plan.md` → *Carried defects* before deploying it.
            The named gaps at the time of writing are SSO, realtime multi-party
            audio transport, prompt-injection defence (SEC-04), and tool inputs
            that are documented as schema-validated and are not.

            The evaluation suite is not part of this gate — it calls a real
            model, costs money, and is non-deterministic. Run it with
            `forgectl eval run` and read the rates rather than a pass.
